name: Deploy to Amazon S3

on:
  push:
    branches:
      - master
    paths:
      - client/**
  pull_request:
    branches:
      - master
  workflow_dispatch:


permissions:
  id-token: write
  contents: read

jobs:
  S3PackageUpload:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v6
        
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::819352519261:role/github-actions-oidc-role
          role-session-name: awsS3FrontendDeploySession
          aws-region: us-west-2

      - name: Setup node npnm
        uses: actions/setup-node@v7
        with:
          node-version: v24.x
          
      - name: Install dependencies
        run: |
          cd ${{ github.workspace }}/client
          npm i

      - name: Build
        env:
          VITE_BASE_API_URL: /api
        run: |
          cd ${{ github.workspace }}/client
          npm run build

      - name: Deploy to S3
        run: |
          aws s3 cp ${{ github.workspace }}/client/dist s3://react-portfolio-frontend-bucket --recursive

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E12IV6ZOW2IFMC \
            --paths "/*"
 
